<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="sections">
        <!-- Section 1 -->
        <div class="card active">
          <div class="collage">
            <img
              src="img/RobloxScreenShot20250827_180422367.png"
              alt="Photo 1"
              class="photo"
            />
            <div class="text">
              <h1>Happy Birthday!</h1>
              <h2>Wishing you joy today</h2>
              <p>May this year bring happiness and moments to remember.</p>
            </div>
          </div>
        </div>

        <!-- Section 2 -->
        <div class="card">
          <div class="collage">
            <div class="text">
              <h1>Special Memories</h1>
              <h2>For you</h2>
              <p>
                Each moment with you is a reason to smile. Thank you for being
                special.
              </p>
            </div>
            <img
              src="img/RobloxScreenShot20250626_014856245.png"
              alt="Photo 2"
              class="photo photo-2"
            />
          </div>
        </div>

        <!-- Section 3 (Invitation) -->
        <div class="card final">
          <div class="text">
            <h1>Let's Celebrate Together!</h1>
            <h2>Would you like to go on a date?</h2>
            <div class="cta">
              <button
                id="yesBtn"
                class="btn yes"
                aria-label="Say yes"
                onclick="window.open('https://www.tiktok.com/@fr.arum_/video/7540514667727260933?is_from_webapp=1&sender_device=pc&web_id=7483894412436047367')"
              >
                YES
              </button>
              <button id="noBtn" class="btn no" aria-label="Say no">NO</button>
            </div>
            <a href="#" id="fallbackYes" class="fallback">I want to say yes</a>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <button class="nav prev" aria-label="Previous section">‹</button>
      <button class="nav next" aria-label="Next section">›</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
