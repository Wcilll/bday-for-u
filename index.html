<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="sections">
        <!-- Section 1 -->
        <div class="card active">
          <div class="collage">
            <img
              src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMG14bWVubnRmc294Y2J2dHJmNXcweHhtM2xzcHNzMmgxaDF3MTR5biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zKSncwDt0kVtMMhGaG/giphy.gif"
              alt="Photo 1"
              class="photo"
            />
            <div class="text">
              <h1>Happy Birthday!</h1>
              <h2>Wishing you joy today</h2>
              <p>May this year bring happiness and moments to remember.</p>
            </div>
          </div>
        </div>

        <!-- Section 2 -->
        <div class="card">
          <div class="collage">
            <div class="text">
              <h1>Special Memories</h1>
              <h2>For you</h2>
              <p>watch cats dance to make you happier hehehe.</p>
            </div>
            <img
              src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzY0dXJxbWlyNnhiZzV3bzAzbmNtbzY1Z2p3d2VhOWk2NWQ2bGQ5eSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/PdKTOwHgOASGY/giphy.gif"
              alt="Photo 2"
              class="photo photo-2"
            />
          </div>
        </div>

        <!-- Section 3 (Invitation) -->
        <div class="card final">
          <div class="text">
            <h1>lastttt</h1>
            <h2>I hope you like it.</h2>
            <div class="cta">
              <button
                id="yesBtn"
                class="btn yes"
                aria-label="Say yes"
                onclick="window.open('https://www.tiktok.com/@furrbabyfinds/video/7342889891509865729?is_from_webapp=1&sender_device=pc&web_id=7483894412436047367')"
              >
                YES
              </button>
              <button id="noBtn" class="btn no" aria-label="Say no">NO</button>
            </div>
            <a href="#" id="fallbackYes" class="fallback">Yes Plzz</a>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <button class="nav prev" aria-label="Previous section">‹</button>
      <button class="nav next" aria-label="Next section">›</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
